[project]
name = "fernanda-inf2072"
version = "0.1.0"
description = "Multi-agent RL research — custom Pacman environment with ghost coordination using BenchMARL (IQL, VDN, QMIX)"
requires-python = "==3.11.*"
dependencies = [
    "benchmarl",
    "cloudpickle==3.1.2",
    "farama-notifications==0.0.6",
    "gymnasium==1.3.0",
    "matplotlib==3.10.7",
    "numpy==2.4.5",
    "pettingzoo==1.26.1",
    "pygame-ce==2.5.7",
    "typing-extensions==4.15.0",
]

[tool.uv]
package = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
