[project]
name = "fernanda-inf2072"
version = "0.1.0"
description = "Multi-agent RL research — custom Pacman environment with ghost coordination using BenchMARL (IQL, VDN, QMIX)"
requires-python = "==3.11.*"
dependencies = [
    "benchmarl",
    "cloudpickle==3.1.2",
    "farama-notifications==0.0.6",
    "gymnasium==1.3.0",
    "matplotlib==3.10.7",
    "numpy==2.4.5",
    "pettingzoo==1.26.1",
    "pygame-ce==2.5.7",
    "torch==2.5.1+cu121",
    "typing-extensions==4.15.0",
]

[tool.uv]
package = false

# Pin torch to the CUDA 12.1 wheels (mirrors requirements.txt). Without this,
# uv resolves torch to the latest default-index build (2.12.0), which broke the
# env. `explicit = true` => only packages mapped in [tool.uv.sources] use it.
[tool.uv.sources]
torch = { index = "pytorch-cu121" }

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

# Dev-only tooling (installed by `uv sync`, excluded from a `--no-dev` install).
# pytest backs `make test`; CLAUDE.md lists it as the testing stack.
[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
